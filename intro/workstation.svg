      <rect x="136" y="201" width="336" height="245" rx="16" fill="url(#scan)"/>
      <text x="135" y="474" fill="#55594e" font-size="10" letter-spacing="2">REID SYSTEMS</text>
      <circle id="power" cx="452" cy="468" r="3.4" fill="#586557"/>
      <!-- 486 tower -->
      <path d="M586 188l28-17h167l16 17v335l-25 19Z" fill="url(#side)"/>
      <rect x="581" y="185" width="195" height="358" rx="8" fill="url(#ivory)" stroke="#999581" stroke-width="2"/>
      <rect x="594" y="204" width="168" height="44" rx="3" fill="#afa994" stroke="#898675"/>
      <path d="M602 216h151m-151 9h151m-151 9h151" stroke="#878573" stroke-width="2"/>
      <rect x="594" y="257" width="168" height="35" rx="2" fill="#c5bda6" stroke="#928f7b"/>
      <rect x="594" y="302" width="168" height="64" rx="3" fill="#a59f8b" stroke="#868270"/>
      <path d="M605 335h53v-4h41v4h52v11H605Z" fill="#45493f"/>
