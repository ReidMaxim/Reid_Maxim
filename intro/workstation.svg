        <path d="M-48 55h96v8h-96Z" fill="#81ad89"/>
        <text x="-42" y="80" font-weight="bold" font-size="13" fill="#243b30">REID_MAXIM</text>
        <path d="M-42 85h83m-83 15h83" stroke="#9ea995" stroke-width=".65"/>
        <text x="-42" y="95" font-size="6.2" fill="#304c3b">NFC  /  SYSTEM DISK</text>
        <path d="M-56 111h7v6h-7zm105 0h7v6h-7z" fill="#0c1712"/>
