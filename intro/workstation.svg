      <rect id="drive-led" x="608" y="352" width="9" height="3" fill="#646b53"/>
      <rect x="600" y="395" width="43" height="22" rx="2" fill="#404d41"/><text x="605" y="410" fill="#d5dfc7" font-size="10">RM/86</text>
      <rect x="600" y="455" width="153" height="65" fill="url(#vents)"/>
