<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <radialGradient id="room"><stop stop-color="#39483e"/><stop offset=".58" stop-color="#1d2923"/><stop offset="1" stop-color="#0d1512"/></radialGradient>
    <linearGradient id="ivory" x2=".3" y2="1"><stop stop-color="#e3dbc4"/><stop offset=".55" stop-color="#cfc6ae"/><stop offset="1" stop-color="#a99e85"/></linearGradient>
    <linearGradient id="side" x2="1" y2=".8"><stop stop-color="#9a9481"/><stop offset="1" stop-color="#686957"/></linearGradient>
    <linearGradient id="shell" x2=".8" y2="1"><stop stop-color="#414c48"/><stop offset=".5" stop-color="#25312d"/><stop offset="1" stop-color="#18231e"/></linearGradient>
    <linearGradient id="metal"><stop stop-color="#84968f"/><stop offset=".23" stop-color="#d5ded8"/><stop offset=".55" stop-color="#a0ada6"/><stop offset=".82" stop-color="#e1e5dc"/><stop offset="1" stop-color="#88968f"/></linearGradient>
    <radialGradient id="glass"><stop stop-color="#25382e"/><stop offset=".85" stop-color="#14221c"/><stop offset="1" stop-color="#0b1511"/></radialGradient>
    <pattern id="vents" width="9" height="8" patternUnits="userSpaceOnUse"><path d="M0 2h6" stroke="#616353" stroke-width="3"/></pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 0h3" stroke="#06150e" opacity=".22"/></pattern>
    <clipPath id="drive-mouth"><rect x="-3000" y="340" width="6000" height="4500"/></clipPath>
    <clipPath id="window"><path id="opening" clip-rule="evenodd" d="M-10000 -10000h20000v20000h-20000Z"/></clipPath>
  </defs>
